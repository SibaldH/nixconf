schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000004", "desktop-widget-0000000000000005" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = false

