[bar.default]
capsule = true
end = [ "tray", "notifications", "status", "clipboard", "volume", "brightness", "battery", "control-center" ]
margin_edge = 10
start = [ "launcher", "wallpaper", "workspaces", "media", "gamermode" ]

[battery]
warning_threshold = 20

    [battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
    warning_threshold = 20

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[calendar]
enabled = true

[control_center.calendar]
show_week_numbers = true

