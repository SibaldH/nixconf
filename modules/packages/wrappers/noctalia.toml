[nightlight]
enabled = true
temperature_day = 5800
temperature_night = 2600

[osd.kinds]
keyboard_backlight = false
media = false

[plugin_settings."aristides/udiskie"]
file_manager_cmd = "yazi"

[plugin_settings."avivbintangaringga/nix-monitor"]
update_command = "nh os switch"

[plugin_settings."nomadcxx/gamer-mode"]
profile = "heavy"

[plugin_settings."whyoolw/dropwall"]
copy_to_wallpaper_dir = true

[plugins]
enabled = [ "nomadcxx/gamer-mode", "avivbintangaringga/nix-monitor", "lucasoe/proton-pass", "aristides/udiskie" ]

[shell]
app_icon_color = "on_surface"
font_family = "JetBrainsMono Nerd Font Mono"
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.animation]
    speed = 4.0

    [shell.launcher]
    show_app_actions = true

    [shell.panel]
    launcher_placement = "attached"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "/home/jay/Pictures/Screenshots"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

[wallpaper.default]
path = "/home/jay/Pictures/Wallpapers/wallhaven_4xgjlo.jpg"

[wallpaper.last]
path = "/home/jay/Pictures/Wallpapers/wallhaven_4xgjlo.jpg"

[wallpaper.monitors.DP-10]
path = "/home/jay/Pictures/Wallpapers/wallhaven_4vyw3l.jpg"

[wallpaper.monitors.DP-9]
path = "/home/jay/Pictures/Wallpapers/wallhaven_4vyw3l.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/jay/Pictures/Wallpapers/wallhaven_4xgjlo.jpg"

[widget.gamermode]
type = "nomadcxx/gamer-mode:gamermode"

[widget.status]
type = "aristides/udiskie:status"
